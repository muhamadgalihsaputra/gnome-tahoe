[appearance]
active-workspace-background-color='rgba(255,255,255,0.3)'
active-workspace-border-color='rgba(255,255,255,0.3)'
active-workspace-border-radius=4
active-workspace-border-width=0
active-workspace-text-color='rgb(255,255,255)'
application-styles='.space-bar {\n  -natural-hpadding: 13px;\n}\n\n.space-bar-workspace-label.active {\n  margin: 0 4px;\n  background-color: rgba(255,255,255,0.3);\n  color: rgb(255,255,255);\n  border-color: rgba(255,255,255,0.3);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive.empty {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,0.5);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}'
custom-styles-failed=false
empty-workspace-border-radius=4
empty-workspace-border-width=0
inactive-workspace-border-radius=4
inactive-workspace-border-width=0
workspace-margin=4
workspaces-bar-padding=13

[behavior]
always-show-numbers=true
indicator-style='current-workspace'
position='center'
show-empty-workspaces=true
smart-workspace-names=true

[state]
version=39
